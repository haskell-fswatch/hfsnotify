name: CI

# Temporary experiment workflow (not for merge): just the Windows stress probe, so a cycle takes
# minutes instead of an hour.

on:
  push:
  workflow_dispatch:

jobs:
  stress:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      name: Setup Haskell (Stack)
      with:
        enable-stack: true
        stack-no-global: true
        stack-version: "latest"

    - name: Run stack setup
      shell: bash
      run: |
        export STACK_EXTRA_ARGS="--stack-yaml stack.yaml"
        stack setup $STACK_EXTRA_ARGS
        echo STACK_EXTRA_ARGS="$STACK_EXTRA_ARGS" >> $GITHUB_ENV

    - uses: actions/cache@v4
      name: Cache ~/.stack
      with:
        path: ~/.stack
        key: ${{ runner.os }}-stack.yaml-stack-key3

    - name: Build
      shell: bash
      run: stack build $STACK_EXTRA_ARGS

    - name: Stress
      shell: bash
      run: stack exec $STACK_EXTRA_ARGS example
