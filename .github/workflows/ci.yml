name: CI

# Temporary experiment workflow (not for merge): run the Windows stress probe.

on:
  push:
  workflow_dispatch:

jobs:
  flake-hunt:
    name: ${{ matrix.stack-yaml }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        stack-yaml:
        - stack.yaml
        - stack-ghc912.yaml
        - stack-ghc98.yaml
        - stack-ghc96.yaml

    steps:
    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      name: Setup Haskell (Stack)
      with:
        enable-stack: true
        stack-no-global: true
        stack-version: "latest"

    - name: Run stack setup
      shell: bash
      run: |
        export STACK_EXTRA_ARGS="--stack-yaml ${{matrix.stack-yaml}}"
        stack setup $STACK_EXTRA_ARGS
        echo STACK_EXTRA_ARGS="$STACK_EXTRA_ARGS" >> $GITHUB_ENV

    - uses: actions/cache@v4
      name: Cache ~/.stack
      with:
        path: ~/.stack
        key: ${{ runner.os }}-${{ matrix.stack-yaml }}-stack-key3

    - name: Build
      shell: bash
      run: stack build $STACK_EXTRA_ARGS --test --no-run-tests

    # Ten *cold* runs: a fresh process each time, which is how CI normally exercises the suite
    - name: Test (ten cold runs)
      shell: bash
      run: |
        failures=0
        for i in $(seq 1 10); do
          echo "=== COLD RUN $i"
          stack test $STACK_EXTRA_ARGS --ta "--print-failures" || failures=$((failures+1))
        done
        echo "=== COLD RUNS FAILED: $failures of 10"
